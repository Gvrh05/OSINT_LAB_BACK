name: DevSecOps - backend OSINT
on:
  push:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar secretos en el historial
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep
      - name: Semgrep SAST
        continue-on-error: true
        run: semgrep scan --config auto .
      - name: Regla local OSINT - ruta de archivo
        continue-on-error: true
        run: semgrep scan --config .semgrep/osint.yml src
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: pnpm audit - todas las dependencias
        continue-on-error: true
        run: pnpm audit --audit-level low
  dast:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar acceso público antes de ZAP
        env:
          TARGET_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail --show-error --silent --location --retry 6 --retry-all-errors --retry-delay 10 --max-time 35 "$TARGET_URL" > /dev/null
          echo "El destino responde correctamente: $TARGET_URL"
      - name: ZAP baseline - API pública autorizada
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.APP_URL }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: osint-back-zap-report
