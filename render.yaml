services:
  - type: web
    name: osint-lab-back
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: TSE_AUTOLOAD
        value: 'false'
      - key: TSE_DOWNLOAD_ENABLED
        value: 'false'
      - key: FRONTEND_URL
        sync: false
